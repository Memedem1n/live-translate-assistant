appId: com.interviewcopilot.assistant
productName: Interview Copilot
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
compression: maximum
asar: true
files:
  - out/**
  - package.json
  - '!**/*.map'
  - '!**/*.md'
extraResources:
  - from: scripts
    to: scripts
    filter:
      - stt_worker.py
      - extract_profile_text.py
      - sync_web_corpus.py
      - build_glossary_lexicon.py
  - from: configs
    to: configs
    filter:
      - web_corpus_sources.yaml
      - glossary_seed.json
directories:
  output: dist
win:
  executableName: InterviewCopilot
  verifyUpdateCodeSignature: false
  requestedExecutionLevel: asInvoker
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
nsis:
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Interview Copilot
  deleteAppDataOnUninstall: false

