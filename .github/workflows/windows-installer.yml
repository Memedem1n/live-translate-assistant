name: Windows Installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows-installer:
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Generate app icon
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/generate_icon.ps1 -OutputPath build/icon.ico

      - name: Setup optional code signing
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERT_PFX_BASE64) -or [string]::IsNullOrWhiteSpace($env:WINDOWS_CERT_PASSWORD)) {
            Write-Warning "WINDOWS_CERT_PFX_BASE64 / WINDOWS_CERT_PASSWORD not set. Building unsigned installer."
            "LIVE_TRANSLATE_SIGNING=false" >> $env:GITHUB_ENV
            exit 0
          }

          $certPath = Join-Path $env:RUNNER_TEMP "livetranslate-codesign.pfx"
          [System.IO.File]::WriteAllBytes($certPath, [System.Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64))
          "CSC_LINK=$certPath" >> $env:GITHUB_ENV
          "CSC_KEY_PASSWORD=$env:WINDOWS_CERT_PASSWORD" >> $env:GITHUB_ENV
          "LIVE_TRANSLATE_SIGNING=true" >> $env:GITHUB_ENV
          Write-Host "Code signing certificate configured."

      - name: Print signing mode
        shell: pwsh
        run: |
          if ($env:LIVE_TRANSLATE_SIGNING -eq "true") {
            Write-Host "Signing mode: enabled"
          } else {
            Write-Host "Signing mode: disabled (unsigned build)"
          }

      - name: Build installer
        run: npm run build:win

      - name: Verify Authenticode signatures
        if: env.LIVE_TRANSLATE_SIGNING == 'true'
        shell: pwsh
        run: |
          $patterns = @(
            "dist\\LiveTranslate Assistant-*.exe",
            "dist\\win-unpacked\\LiveTranslateAssistant.exe"
          )
          $files = @()
          foreach ($pattern in $patterns) {
            $matches = Get-ChildItem -Path $pattern -File -ErrorAction SilentlyContinue
            if ($matches) {
              $files += $matches
            }
          }

          if ($files.Count -eq 0) {
            throw "No executable files found for signature verification."
          }

          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature -FilePath $file.FullName
            Write-Host "$($file.Name) signature status: $($signature.Status)"
            if ($signature.Status -ne "Valid") {
              throw "Invalid signature status for $($file.FullName): $($signature.Status)"
            }
          }

      - name: Generate SHA256 checksums
        shell: pwsh
        run: |
          $targets = Get-ChildItem -Path dist -File | Where-Object { $_.Extension -in '.exe', '.yml', '.blockmap', '.zip' }
          if ($targets.Count -eq 0) {
            throw "No installer artifacts found in dist/"
          }
          $lines = @()
          foreach ($file in $targets) {
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLower()
            $lines += "$hash  $($file.Name)"
          }
          Set-Content -Path dist/SHA256SUMS.txt -Value $lines

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: livetranslate-windows-installer
          path: |
            dist/*.exe
            dist/*.yml
            dist/*.blockmap
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Attach to GitHub Release (tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            dist/*.exe
            dist/*.yml
            dist/*.blockmap
            dist/*.zip
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: false
