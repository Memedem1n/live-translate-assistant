global:
  version: 2
  allow_domains:
    - github.com
    - raw.githubusercontent.com
    - martinfowler.com
    - aws.amazon.com
    - docs.aws.amazon.com
    - learn.microsoft.com
    - cloud.google.com
    - kubernetes.io
    - postgresql.org
    - redis.io
    - mongodb.com
    - opentelemetry.io
    - prometheus.io
    - grafana.com
    - owasp.org
    - cheatsheetseries.owasp.org
    - auth0.com
    - techinterviewhandbook.org
    - roadmap.sh
    - cp-algorithms.com
    - huggingface.co
    - arxiv.org
    - paperswithcode.com
    - ml-ops.org
    - tensorflow.org
    - kubeflow.org
    - react.dev
    - developer.mozilla.org
    - web.dev
    - grpc.io
    - microservices.io
    - use-the-index-luke.com
    - sre.google
    - bytebytego.com
    - highscalability.com
    - interviewing.io
    - indeed.com
  block_domains:
    - pinterest.com
    - facebook.com
    - instagram.com
    - tiktok.com
    - quora.com
  exclude_url_patterns:
    - "/login"
    - "/signup"
    - "/sign-up"
    - "/register"
    - "/auth/"
    - "\\?share="
    - "\\?source="
    - "\\?utm_"
    - "/tag/"
    - "/tags/"
    - "/topics/"
    - "/topic/"
    - "/category/"
    - "/categories/"
    - "/search"
  search_results_per_query: 12
  max_per_domain: 28

categories:
  - name: system_design
    tier: tier1
    weight: 10
    allow_domains:
      - github.com
      - bytebytego.com
      - martinfowler.com
      - highscalability.com
      - aws.amazon.com
      - cloud.google.com
    queries:
      - "system design interview questions scalability tradeoffs"
      - "design url shortener interview architecture"
      - "capacity planning and bottleneck analysis interview"
    seed_urls:
      - "https://github.com/donnemartin/system-design-primer"
      - "https://bytebytego.com/"
      - "https://martinfowler.com/architecture/"
      - "https://highscalability.com/"
      - "https://github.com/binhnguyennus/awesome-scalability"
      - "https://github.com/umitkacar/awesome-interview"

  - name: distributed_systems
    tier: tier1
    weight: 9
    allow_domains:
      - aws.amazon.com
      - microservices.io
      - cloud.google.com
      - docs.aws.amazon.com
      - martinfowler.com
    queries:
      - "distributed systems interview consistency availability partition tolerance"
      - "idempotency retries distributed systems interview"
      - "event driven architecture failure handling"
    seed_urls:
      - "https://aws.amazon.com/builders-library/"
      - "https://microservices.io/patterns/index.html"
      - "https://martinfowler.com/tags/microservices.html"
      - "https://docs.aws.amazon.com/wellarchitected/latest/framework/welcome.html"
      - "https://learn.microsoft.com/tr-tr/azure/architecture/guide/architecture-styles/microservices"
      - "https://learn.microsoft.com/tr-tr/azure/architecture/microservices/design/"

